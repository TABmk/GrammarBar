name: macOS release

on:
  push:
    tags:
      - '**'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: npm ci
      - name: Prepare bundled runtime
        run: node scripts/prepare.mjs
      - run: npm test
      - run: npm run build -- -- --locked
      - name: Package application
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent \
            'src-tauri/target/release/bundle/macos/GrammarBar.app' \
            "dist/GrammarBar-macos-${ARCH}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --draft --title "$TAG" --notes 'Download arm64 for Apple Silicon or x64 for Intel. Unzip and move GrammarBar.app to Applications. This build is not signed with an Apple Developer certificate or notarized.'
          fi
          gh release upload "$TAG" dist/*.zip --clobber
          gh release edit "$TAG" --draft=false

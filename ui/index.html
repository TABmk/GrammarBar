<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="author" content="TAB_mk"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrammarBar</title><link rel="stylesheet" href="style.css"><script type="module" src="app.js"></script></head>
<body>
<svg class="symbols" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6m8 4v6"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
<symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></symbol>
</defs></svg>
<svg class="popover-arrow" viewBox="0 0 36 13" aria-hidden="true"><path d="M0 13C8 13 10 1 18 1S28 13 36 13"/></svg>
<div class="surface">
<main>
<div class="editors">
<section class="editor"><div class="section-head"><label for="source">Original</label></div>
<textarea id="source" placeholder="Paste text…" spellcheck="false" maxlength="40000" autofocus></textarea></section>
<section class="editor output"><div class="section-head"><label for="result">Result</label><button class="icon small" id="copy-button" aria-label="Copy result" title="Copy" disabled><svg><use href="#i-copy"/></svg></button></div>
<textarea id="result" placeholder="" readonly aria-live="polite"></textarea></section>
</div>
<section class="changes-section" id="changes-section" hidden><div class="section-head"><h2>Changes <span id="change-count"></span></h2></div><div id="changes" class="changes" aria-label="Text with changes" aria-live="polite"><span class="empty-mark">—</span></div></section>
<footer><button class="icon" id="settings-button" aria-label="Settings" title="Settings · ⌘,"><svg><use href="#i-settings"/></svg><span class="status-dot" id="connection-dot"></span></button><span id="status" role="status" aria-live="polite"></span><button id="clear-button" class="secondary" title="Clear all text" disabled>Clear</button><button id="fix-button" class="primary" disabled><span>Correct</span><kbd>⌘↵</kbd><svg><use href="#i-arrow"/></svg></button></footer>
<button type="button" class="resize-handle" aria-label="Resize window height" title="Resize height"></button>
</main>
</div>
<dialog id="settings-dialog" aria-labelledby="settings-title"><form id="settings-form">
<div class="dialog-head"><button type="button" class="back-button" id="close-settings" aria-label="Back to editor"><svg><use href="#i-back"/></svg>Editor</button><h1 id="settings-title">Settings</h1><span class="header-spacer" aria-hidden="true"></span></div>
<div class="account-row"><div><strong>ChatGPT</strong><span id="account-label">Not connected</span></div><button type="button" id="connect-button" class="secondary">Connect</button></div>
<div class="model-row"><label for="model">Model</label><select id="model" disabled><option value="">Default</option></select></div>
<label class="prompt-label" for="prompt">Instructions</label><textarea id="prompt" maxlength="10000" spellcheck="false"></textarea>
<div class="settings-footer"><span id="settings-status" role="status"></span><button type="submit" class="primary" id="save-button">Save</button></div>
</form><button type="button" class="resize-handle" aria-label="Resize window height" title="Resize height"></button></dialog>
<div id="tooltip" role="tooltip" hidden></div>
</body></html>
